<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>agent-search</title>
  <link rel="stylesheet" href="/static/style.css?v=3">
</head>
<body>
  <header>
    <h1>agent-search</h1>
    <button id="reindex-btn" title="Przeindeksuj corpus">&#x21bb;</button>
  </header>

  <div id="arena">
    <section class="panel" id="panel-left">
      <div class="panel-header"><span class="model-name">...</span></div>
      <div class="panel-messages"></div>
    </section>
    <div class="panel-divider"></div>
    <section class="panel" id="panel-right">
      <div class="panel-header"><span class="model-name">...</span></div>
      <div class="panel-messages"></div>
    </section>
  </div>

  <footer>
    <form id="chat-form">
      <textarea id="input" placeholder="Zadaj pytanie..." rows="1" autofocus></textarea>
      <button type="submit" id="send-btn">&#x27A4;</button>
    </form>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="/static/chat.js?v=3"></script>
</body>
</html>
