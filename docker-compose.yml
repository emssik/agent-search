services:
  agent-search:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${CORPUS_PATH:-./test-corpus}:/corpus
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AGENT_MODEL_LEFT=${AGENT_MODEL_LEFT:-gemini-3-flash-preview}
      - AGENT_MODEL_RIGHT=${AGENT_MODEL_RIGHT:-gpt-5-mini}
      - STEMMER_LANGUAGE=${STEMMER_LANGUAGE:-pl}
